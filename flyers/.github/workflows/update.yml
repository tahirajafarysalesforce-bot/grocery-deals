yaml
name: Update deals

on:
  push:
    paths:
      - "flyers/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic pillow

      - name: Read new flyers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/extract_flyers.py

      - name: Build combined deals file
        run: python scripts/build_deals.py

      - name: Commit updated data
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update deals" && git push)
